name: Registry

# Publishes index.json, a Termix custom registry listing every signed release,
# to the registry branch. Admins add
# https://raw.githubusercontent.com/<owner>/<repo>/registry/index.json under
# Plugins, Registries, and install and update the plugin from Browse.
#
# Needs the TERMIX_PLUGIN_SIGNING_KEY secret, the same one the Release
# workflow signs with. Runs after every Release run, when a release is
# published or changed by hand, and on demand.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: registry
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Build the index
        env:
          GH_TOKEN: ${{ github.token }}
          TERMIX_PLUGIN_SIGNING_KEY: ${{ secrets.TERMIX_PLUGIN_SIGNING_KEY }}
        run: |
          if [ -z "$TERMIX_PLUGIN_SIGNING_KEY" ]; then
            echo "::error::Add the TERMIX_PLUGIN_SIGNING_KEY secret first. See README.md, Install from GitHub."
            exit 1
          fi
          set -o pipefail
          node scripts/build-registry.mjs "$RUNNER_TEMP/index.json" --sign-missing | tee "$RUNNER_TEMP/build.log"

      - name: Publish to the registry branch
        env:
          HUSKY: "0"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          dir="$RUNNER_TEMP/registry"
          if git ls-remote --exit-code --heads origin registry > /dev/null; then
            git fetch --depth 1 origin registry
            git worktree add -B registry "$dir" origin/registry
          else
            git worktree add --detach "$dir"
            git -C "$dir" checkout --orphan registry
            git -C "$dir" rm -rfq .
          fi

          # updatedAt changes on every run; only publish when something else did.
          if [ -f "$dir/index.json" ] && node -e '
            const fs = require("fs");
            const strip = (f) => { const j = JSON.parse(fs.readFileSync(f, "utf8")); delete j.updatedAt; return JSON.stringify(j); };
            process.exit(strip(process.argv[1]) === strip(process.argv[2]) ? 0 : 1);
          ' "$dir/index.json" "$RUNNER_TEMP/index.json"; then
            echo "The registry is already up to date"
          else
            cp "$RUNNER_TEMP/index.json" "$dir/index.json"
            git -C "$dir" add index.json
            git -C "$dir" commit -m "chore: update registry index"
            git -C "$dir" push origin registry
          fi

          key_id=$(sed -n 's/.*key id \([0-9a-f]*\).*/\1/p' "$RUNNER_TEMP/build.log")
          {
            echo "## Termix registry"
            echo
            echo "Add this URL in Termix under Plugins, Registries, Add registry:"
            echo
            echo '```'
            echo "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/registry/index.json"
            echo '```'
            echo
            echo "Check that Termix shows the key id \`$key_id\` before you trust it."
          } >> "$GITHUB_STEP_SUMMARY"
